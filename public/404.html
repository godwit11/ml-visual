<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>页面没找到 · 奇迹学习</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // 与 src/core/theme.ts 用同一个存储键，避免 404 页和站内主题不一致
      (function () {
        try {
          var t = localStorage.getItem('mlv-theme')
          if (t !== 'dark' && t !== 'light') {
            t =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <style>
      :root {
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        --r-md: 10px;
        --r-lg: 14px;
        --maxw: 1180px;
        --nav-h: 56px;
        --t-fast: 0.15s ease;
      }
      :root[data-theme='light'] {
        --bg: #f6f7fb;
        --bg-elev: #ffffff;
        --text: #1a1d24;
        --text-2: #565b66;
        --text-3: #8b90a0;
        --border: #e3e6ee;
        --primary: #4f46e5;
        --primary-weak: #eef0ff;
        --accent: #0d9488;
        --shadow-2: 0 6px 18px rgba(16, 24, 40, 0.08);
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #0e1116;
        --bg-elev: #161a22;
        --text: #e6e8ee;
        --text-2: #a2a9b8;
        --text-3: #6f7787;
        --border: #262b36;
        --primary: #818cf8;
        --primary-weak: #1e2130;
        --accent: #2dd4bf;
        --shadow-2: 0 6px 18px rgba(0, 0, 0, 0.45);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: var(--font-sans);
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      .nav {
        height: var(--nav-h);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 20px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-elev);
      }
      .nav-brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 15px;
        font-weight: 500;
        color: var(--text);
        text-decoration: none;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--primary);
        display: inline-block;
      }
      .nav-spacer {
        flex: 1;
      }
      .theme-toggle {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-2);
        cursor: pointer;
        font-size: 15px;
        line-height: 1;
        transition: background var(--t-fast), border-color var(--t-fast);
      }
      .theme-toggle:hover {
        background: var(--primary-weak);
        border-color: var(--primary);
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 20px;
      }
      .card {
        max-width: 560px;
        width: 100%;
        text-align: center;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: 48px 32px;
        box-shadow: var(--shadow-2);
      }
      .code {
        font-size: 64px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: 2px;
        color: var(--primary);
        margin: 0 0 8px;
      }
      h1 {
        font-size: 22px;
        font-weight: 500;
        margin: 0 0 12px;
      }
      p {
        font-size: 14px;
        line-height: 1.7;
        color: var(--text-2);
        margin: 0 auto 8px;
        max-width: 42em;
      }
      .hint {
        font-size: 13px;
        color: var(--text-3);
        margin-top: 16px;
      }
      .hint code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: var(--primary-weak);
        color: var(--primary);
        padding: 2px 6px;
        border-radius: 6px;
        word-break: break-all;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 28px;
      }
      .btn {
        display: inline-block;
        font-size: 14px;
        font-family: inherit;
        padding: 10px 20px;
        border-radius: var(--r-md);
        text-decoration: none;
        cursor: pointer;
        transition: filter var(--t-fast), background var(--t-fast);
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
        border: 1px solid var(--primary);
      }
      :root[data-theme='dark'] .btn-primary {
        color: #0e1116;
        font-weight: 500;
      }
      .btn-primary:hover {
        filter: brightness(1.08);
      }
      .btn-ghost {
        background: transparent;
        color: var(--text-2);
        border: 1px solid var(--border);
      }
      .btn-ghost:hover {
        background: var(--primary-weak);
        border-color: var(--primary);
        color: var(--primary);
      }
      footer {
        text-align: center;
        font-size: 12px;
        color: var(--text-3);
        padding: 20px;
        border-top: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <a class="nav-brand" href="/"><span class="dot"></span>奇迹学习</a>
      <span class="nav-spacer"></span>
      <button class="theme-toggle" id="theme-toggle" aria-label="切换深浅色主题"></button>
    </nav>

    <main>
      <div class="card">
        <p class="code">404</p>
        <h1>这个页面还没长出来</h1>
        <p>
          你要找的地址不存在。可能是链接敲错了，也可能是这个演示还在计划表里——
          目前已经上线 5 个演示，剩下的在陆续补。
        </p>
        <p class="hint">请求的路径：<code id="path">/</code></p>
        <div class="actions">
          <a class="btn btn-primary" href="/">回到首页</a>
          <a class="btn btn-ghost" href="/#demos">看全部演示</a>
        </div>
      </div>
    </main>

    <footer>奇迹学习 · 机器学习交互演示</footer>

    <script>
      ;(function () {
        document.getElementById('path').textContent =
          location.pathname + location.search + location.hash

        var btn = document.getElementById('theme-toggle')
        function paint() {
          var dark = document.documentElement.getAttribute('data-theme') === 'dark'
          btn.textContent = dark ? '☾' : '☀'
        }
        btn.addEventListener('click', function () {
          var next =
            document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
          document.documentElement.setAttribute('data-theme', next)
          try {
            localStorage.setItem('mlv-theme', next)
          } catch (e) {}
          paint()
        })
        paint()
      })()
    </script>
  </body>
</html>
